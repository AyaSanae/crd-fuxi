# =============================================================================
#  Xiaomi 13 (fuxi) / crDroid 16 编译配置
#  改完用 ./build-fuxi.sh 开编。直接 brunch 不会读这份文件。
# =============================================================================

# ---------- 关于手机显示（不跟编译机 hostname）----------
BUILD_USERNAME=crdroid
BUILD_HOSTNAME=fuxi
CRDROID_MAINTAINER=crdroid

# ---------- 内核 LTO：none | thin | full | 留空=跟设备树默认 ----------
# AutoDL / cgroup 限内存时 full 容易在 ld.lld vmlinux.o 被 137 杀掉。
# thin 省峰值内存，仍有优化。OOM 再降就改 none。
# 改这项会自动清 KERNEL_OBJ，内核会重编。
KERNEL_LTO=thin

# ---------- 并行 ----------
# 清华 AOSP 并发太高会 503；容器 cgroup 内存紧时 -j8 会把 ninja 整进程掐死。
SYNC_JOBS=4
MAKE_JOBS=4

# ---------- ccache ----------
# AOSP 已不自带 ccache，必须同时有 USE_CCACHE=1 和 CCACHE_EXEC。
# 目录留空则：有 /root/autodl-tmp 用 /root/autodl-tmp/.ccache，否则 ~/.cache/ccache。
# 查统计必须带同一个目录：CCACHE_DIR=... ccache -s
USE_CCACHE=1
CCACHE_SIZE=20G
CCACHE_DIR=

# ---------- 网络（只影响 sync-crdroid-fuxi.sh）----------
# AOSP 走清华，不占代理。留空则走 android.googlesource.com
# https://mirrors.tuna.tsinghua.edu.cn/help/AOSP/
AOSP_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/git/AOSP

# 非 AOSP（GitHub / crDroid / LineageOS / TheMuppets）走代理。
# 留空则用当前环境的 http_proxy / https_proxy。
HTTP_PROXY=
HTTPS_PROXY=
